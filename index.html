<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Scanner</title>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --card: #fbf3f4;
    --maroon: #7a1a2b;
    --maroon-dark: #4d0f1a;
    --maroon-light: #9c2740;
    --maroon-pale: #f3dde1;
    --success: #2f9e52;
    --success-bg: #eaf7ee;
    --danger: #c0392b;
    --danger-bg: #fbeae8;
    --text: #2a1216;
    --text-dim: #7a5b60;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 40px;
  }

  .logo {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 10px;
    border: 2px solid var(--maroon);
    box-shadow: 0 0 0 3px var(--maroon-pale);
  }

  h1 {
    font-size: 1.2rem;
    font-weight: 700;
    margin: 0 0 2px;
    color: var(--maroon);
    letter-spacing: 0.02em;
    text-align: center;
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 0.82rem;
    margin-bottom: 18px;
    text-align: center;
  }

  #reader-wrapper {
    width: 100%;
    max-width: 380px;
    border-radius: 16px;
    overflow: hidden;
    border: 2px solid var(--maroon);
    background: #000;
    position: relative;
  }

  #reader {
    width: 100%;
  }

  #status-card {
    width: 100%;
    max-width: 380px;
    margin-top: 20px;
    padding: 18px 20px;
    border-radius: 14px;
    background: var(--card);
    text-align: center;
    min-height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease;
    border: 1px solid var(--maroon-pale);
  }

  #status-card.success { background: var(--success-bg); border: 1px solid var(--success); }
  #status-card.error   { background: var(--danger-bg); border: 1px solid var(--danger); }
  #status-card.idle    { background: var(--card); border: 1px solid var(--maroon-pale); }

  #status-text {
    font-size: 1rem;
    font-weight: 500;
  }

  #status-card.idle #status-text {
    color: var(--text-dim);
    font-weight: 400;
  }

  .spinner {
    width: 18px;
    height: 18px;
    border: 2px solid var(--maroon-pale);
    border-top-color: var(--maroon);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-right: 10px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  #manual-toggle {
    margin-top: 18px;
    background: none;
    border: 1px solid var(--maroon);
    color: var(--maroon);
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 0.8rem;
    cursor: pointer;
  }

  #manual-entry {
    display: none;
    width: 100%;
    max-width: 380px;
    margin-top: 14px;
    gap: 8px;
  }

  #manual-entry.visible { display: flex; }

  #manual-id {
    flex: 1;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--maroon-light);
    background: #ffffff;
    color: var(--text);
    font-size: 0.9rem;
  }

  #manual-submit {
    padding: 10px 16px;
    border-radius: 10px;
    border: none;
    background: var(--maroon);
    color: #ffffff;
    font-weight: 600;
    cursor: pointer;
  }

  #manual-submit:active { background: var(--maroon-dark); }

  .toggle-group {
    width: 100%;
    max-width: 380px;
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }

  .toggle-group:first-of-type {
    margin-top: 20px;
  }

  .toggle-btn {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid var(--maroon-light);
    background: #ffffff;
    color: var(--maroon);
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }

  .toggle-btn.active {
    background: var(--maroon);
    border-color: var(--maroon);
    color: #ffffff;
  }

  #scan-btn {
    margin-top: 20px;
    width: 100%;
    max-width: 380px;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: var(--maroon);
    color: #ffffff;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 2px 10px rgba(122, 26, 43, 0.25);
  }

  #scan-btn:active { background: var(--maroon-dark); }

  #scan-btn:disabled {
    background: #d8c3c6;
    color: #ffffff;
    cursor: not-allowed;
    box-shadow: none;
  }

  #reader-overlay {
    position: absolute;
    inset: 0;
    background: rgba(122, 26, 43, 0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    font-size: 0.9rem;
    color: #ffffff;
  }

  #reader-overlay.hidden { display: none; }

  .sync-bar {
    width: 100%;
    max-width: 380px;
    margin-top: 14px;
    padding: 12px 16px;
    border-radius: 12px;
    background: var(--maroon-pale);
    border: 1px solid var(--maroon-light);
    color: var(--maroon-dark);
    font-size: 0.85rem;
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }

  .sync-bar.visible { display: flex; }

  .sync-bar .sync-actions {
    display: flex;
    gap: 6px;
  }

  .sync-bar button {
    background: var(--maroon);
    color: #ffffff;
    border: none;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }

  .sync-bar button.secondary {
    background: transparent;
    border: 1px solid var(--maroon);
    color: var(--maroon);
  }

  .link-btn {
    margin-top: 10px;
    background: none;
    border: none;
    color: var(--maroon);
    font-size: 0.78rem;
    text-decoration: underline;
    cursor: pointer;
    padding: 4px;
  }

  .conn-badge {
    width: 100%;
    max-width: 380px;
    text-align: center;
    font-size: 0.75rem;
    margin-top: 10px;
    color: var(--text-dim);
  }

  .conn-badge.offline { color: var(--danger); }
</style>
</head>

  <h1>COE Attendance Scanner</h1>
  <div class="subtitle">Point the camera at a student's QR code</div>

  <div id="reader-wrapper">
    <div id="reader"></div>
    <div id="reader-overlay">Tap "Scan QR Code" below to begin</div>
  </div>

  <div class="toggle-group" id="session-group">
    <button class="toggle-btn active" data-value="AM">AM</button>
    <button class="toggle-btn" data-value="PM">PM</button>
  </div>

  <div class="toggle-group" id="action-group">
    <button class="toggle-btn active" data-value="in">Log In</button>
    <button class="toggle-btn" data-value="out">Log Out</button>
  </div>

  <button id="scan-btn">Scan QR Code</button>

  <div id="status-card" class="idle">
    <span id="status-text">Waiting for scan…</span>
  </div>

  <button id="manual-toggle">Enter ID manually</button>
  <div id="manual-entry">
    <input id="manual-id" type="text" placeholder="e.g. 2023-4-0422" />
    <button id="manual-submit">Submit</button>
  </div>

  <div class="sync-bar" id="sync-bar">
    <span id="sync-text">0 scans waiting to sync</span>
    <div class="sync-actions">
      <button id="backup-btn" class="secondary">Backup</button>
      <button id="sync-now-btn">Sync Now</button>
    </div>
  </div>

  <button id="restore-btn" class="link-btn">Restore from backup file</button>
  <input type="file" id="restore-file-input" accept="application/json" style="display:none;">

  <div class="conn-badge" id="conn-badge">● Online</div>

  <script>
    // =======================================================
    // CONFIG — fill these in
    // =======================================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzu91PZzlmqXve_4tZ7xtYxfCW2le2X391vWuYVHx4KwiSPfY6ssSO1UN5K6zM5-7To/exec"; // e.g. https://script.google.com/macros/s/AKfycb.../exec
    const DEVICE_KEY = "COE_ATTENDANCE"; // must match SECRET_KEY in Code.gs
    // =======================================================

    const statusCard = document.getElementById("status-card");
    const statusText = document.getElementById("status-text");

    let isProcessing = false;      // prevents duplicate calls while one is in flight

    // --- Session (AM/PM) and Action (in/out) toggles ---
    let selectedSession = "AM";
    let selectedAction = "in";

    function setupToggleGroup(groupId, onChange) {
      const group = document.getElementById(groupId);
      const buttons = group.querySelectorAll(".toggle-btn");
      buttons.forEach((btn) => {
        btn.addEventListener("click", () => {
          buttons.forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          onChange(btn.dataset.value);
        });
      });
    }

    setupToggleGroup("session-group", (value) => { selectedSession = value; });
    setupToggleGroup("action-group", (value) => { selectedAction = value; });

    function setStatus(message, type) {
      statusCard.className = type; // "idle" | "success" | "error" | "loading"
      statusText.textContent = message;
    }

    function setLoading(message) {
      statusCard.className = "idle";
      statusText.innerHTML = "";
      const spinner = document.createElement("span");
      spinner.className = "spinner";
      statusText.appendChild(spinner);
      statusText.appendChild(document.createTextNode(message));
    }

    // --- Parses a scanned QR payload. Expected format: "ID|Name|Program".
    //     Falls back gracefully if it's just a plain ID (e.g. manual entry). ---
    function parseQrPayload(text) {
      const parts = text.split("|");
      if (parts.length >= 2) {
        return {
          id: parts[0].trim(),
          name: parts[1] ? parts[1].trim() : null,
          program: parts[2] ? parts[2].trim() : null
        };
      }
      return { id: text.trim(), name: null, program: null };
    }

    async function submitScan(payload) {
      if (isProcessing) return;

      // Accept either a plain string (manual entry) or a parsed { id, name, program } object
      if (typeof payload === "string") {
        payload = { id: payload, name: null, program: null };
      }

      isProcessing = true;

      const displayLabel = payload.name
        ? payload.name + (payload.program ? " (" + payload.program + ")" : "")
        : payload.id;

      const scanRecord = {
        id: payload.id,
        session: selectedSession,
        action: selectedAction,
        clientTime: new Date().toISOString() // captured at the exact moment of scan, used even if synced later
      };

      setLoading("Recording " + displayLabel + " (" + selectedSession + " " + (selectedAction === "in" ? "Time In" : "Time Out") + ")…");

      const result = await sendToServer(scanRecord);

      if (result.ok) {
        if (result.text.toLowerCase().includes("recorded") && !result.text.toLowerCase().includes("already")) {
          setStatus("✅ " + result.text, "success");
          if (navigator.vibrate) navigator.vibrate(120); // single short buzz = success
        } else {
          setStatus("⚠️ " + result.text, "error");
          if (navigator.vibrate) navigator.vibrate([80, 60, 80]); // double buzz = needs attention
        }
      } else {
        // Network failure — assume offline (or server unreachable) and queue for later
        queueScan(scanRecord);
        setStatus("📥 Saved offline for " + displayLabel + " — will sync when online", "idle");
        if (navigator.vibrate) navigator.vibrate([80, 60, 80]);
      }

      isProcessing = false;
    }

    // --- Sends one scan record to the server. Returns { ok, text }. Never throws. ---
    async function sendToServer(record) {
      try {
        const url = SCRIPT_URL
          + "?id=" + encodeURIComponent(record.id)
          + "&key=" + encodeURIComponent(DEVICE_KEY)
          + "&session=" + encodeURIComponent(record.session)
          + "&action=" + encodeURIComponent(record.action)
          + "&clientTime=" + encodeURIComponent(record.clientTime);

        const response = await fetch(url, { method: "GET" });
        const text = await response.text();
        return { ok: true, text: text };
      } catch (err) {
        return { ok: false, text: "" };
      }
    }

    // =======================================================
    // OFFLINE QUEUE
    // =======================================================
    const QUEUE_KEY = "coe_attendance_pending_scans";
    const syncBar = document.getElementById("sync-bar");
    const syncText = document.getElementById("sync-text");
    const syncNowBtn = document.getElementById("sync-now-btn");
    const connBadge = document.getElementById("conn-badge");

    let isSyncing = false;

    function getQueue() {
      try {
        return JSON.parse(localStorage.getItem(QUEUE_KEY)) || [];
      } catch (e) {
        return [];
      }
    }

    function saveQueue(queue) {
      localStorage.setItem(QUEUE_KEY, JSON.stringify(queue));
      updateSyncBar();
    }

    function queueScan(record) {
      const queue = getQueue();
      queue.push(record); // pushed in the exact order scanned, so sync stays chronological
      saveQueue(queue);
    }

    function updateSyncBar() {
      const count = getQueue().length;
      if (count > 0) {
        syncText.textContent = count + " scan" + (count === 1 ? "" : "s") + " waiting to sync";
        syncBar.classList.add("visible");
      } else {
        syncBar.classList.remove("visible");
      }
    }

    async function syncQueue() {
      if (isSyncing) return;
      const queue = getQueue();
      if (queue.length === 0) return;

      isSyncing = true;
      syncNowBtn.textContent = "Syncing…";
      syncNowBtn.disabled = true;

      // Process in order (FIFO) so the actual scan sequence is preserved.
      // Stop at the first failure — likely still offline — and retry later.
      while (getQueue().length > 0) {
        const currentQueue = getQueue();
        const next = currentQueue[0];
        const result = await sendToServer(next);

        if (!result.ok) {
          break; // still offline (or server down) — leave remaining items queued
        }

        // Success (or a server-side rejection like "Invalid Student ID") — remove from queue either way,
        // since retrying a request the server already understood and answered won't change the outcome.
        currentQueue.shift();
        saveQueue(currentQueue);
      }

      isSyncing = false;
      syncNowBtn.textContent = "Sync Now";
      syncNowBtn.disabled = false;
    }

    syncNowBtn.addEventListener("click", syncQueue);

    // --- Backup export: lets an officer manually save pending scans to a file
    //     as an extra safety net, in case the browser's storage ever gets cleared. ---
    const backupBtn = document.getElementById("backup-btn");
    backupBtn.addEventListener("click", () => {
      const queue = getQueue();
      if (queue.length === 0) return;

      const blob = new Blob([JSON.stringify(queue, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const stamp = new Date().toISOString().replace(/[:.]/g, "-");
      a.href = url;
      a.download = "attendance-backup-" + stamp + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    // --- Restore from a backup file: reads a previously-exported JSON file
    //     and merges its scans back into the local queue for another sync attempt.
    //     Safe to run even if some entries were already synced — the server's
    //     "already recorded" check means a re-sent duplicate is simply ignored. ---
    const restoreBtn = document.getElementById("restore-btn");
    const restoreFileInput = document.getElementById("restore-file-input");

    restoreBtn.addEventListener("click", () => {
      restoreFileInput.click();
    });

    restoreFileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const restored = JSON.parse(event.target.result);

          if (!Array.isArray(restored)) {
            throw new Error("File does not contain a list of scans.");
          }

          // Basic shape validation so a random/corrupt file doesn't silently break the queue
          const valid = restored.every((item) =>
            item && typeof item.id === "string" &&
            (item.session === "AM" || item.session === "PM") &&
            (item.action === "in" || item.action === "out") &&
            typeof item.clientTime === "string"
          );

          if (!valid) {
            throw new Error("File format doesn't match an attendance backup.");
          }

          const current = getQueue();
          const merged = current.concat(restored);

          // Keep chronological order by actual scan time, regardless of merge order
          merged.sort((a, b) => new Date(a.clientTime) - new Date(b.clientTime));

          saveQueue(merged);
          setStatus("📂 Restored " + restored.length + " scan(s) from backup", "idle");
          syncQueue(); // try syncing immediately if online

        } catch (err) {
          setStatus("⚠️ Could not restore file: " + err.message, "error");
        }

        restoreFileInput.value = ""; // reset so the same file can be re-selected later if needed
      };

      reader.readAsText(file);
    });

    // --- Warn before leaving the page while scans are still unsynced ---
    window.addEventListener("beforeunload", (e) => {
      if (getQueue().length > 0) {
        e.preventDefault();
        e.returnValue = ""; // required for the browser's native confirmation dialog to appear
      }
    });

    function updateConnBadge() {
      if (navigator.onLine) {
        connBadge.textContent = "● Online";
        connBadge.classList.remove("offline");
        syncQueue(); // try syncing whenever we regain connectivity
      } else {
        connBadge.textContent = "○ Offline — scans will be saved and synced later";
        connBadge.classList.add("offline");
      }
    }

    window.addEventListener("online", updateConnBadge);
    window.addEventListener("offline", updateConnBadge);

    // Initial state on page load
    updateConnBadge();
    updateSyncBar();

    // Periodic retry in case 'online' event doesn't fire reliably (some browsers are inconsistent)
    setInterval(() => {
      if (navigator.onLine) syncQueue();
    }, 20000);

    // --- QR camera scanning (armed / one-shot per button press) ---
    const scanBtn = document.getElementById("scan-btn");
    const readerOverlay = document.getElementById("reader-overlay");

    let html5QrCode = null;
    let isArmed = false;       // true only right after the button is tapped, until one QR is read
    let cameraStarted = false;

    function armScanner() {
      isArmed = true;
      readerOverlay.classList.add("hidden");
      scanBtn.disabled = true;
      scanBtn.textContent = "Scanning…";
      setStatus("Point camera at QR code…", "idle");
    }

    function disarmScanner(overlayMessage) {
      isArmed = false;
      readerOverlay.textContent = overlayMessage || 'Tap "Scan QR Code" below to begin';
      readerOverlay.classList.remove("hidden");
      scanBtn.disabled = false;
      scanBtn.textContent = "Scan QR Code";
    }

    function onScanSuccess(decodedText) {
      if (!isArmed) return; // camera is running but we're ignoring reads until armed again
      isArmed = false; // immediately stop accepting further reads for this session

      if (cameraStarted) {
        html5QrCode.pause(true); // freeze the video feed so it can't re-read the same code
      }

      const payload = parseQrPayload(decodedText.trim());

      submitScan(payload).finally(() => {
        disarmScanner('Tap "Scan QR Code" for the next student');
      });
    }

    function onScanFailure() {
      // fires continuously while no QR is in frame — ignore silently
    }

    if (typeof Html5Qrcode === "undefined") {
      setStatus("⚠️ Scanner library failed to load. Check your internet connection and reload the page.", "error");
      scanBtn.disabled = true;
    } else {
      html5QrCode = new Html5Qrcode("reader");

      scanBtn.addEventListener("click", () => {
        if (!cameraStarted) {
          // First tap: actually start the camera
          html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 240, height: 240 } },
            onScanSuccess,
            onScanFailure
          ).then(() => {
            cameraStarted = true;
            armScanner();
          }).catch((err) => {
            setStatus("⚠️ Camera error: " + err, "error");
          });
        } else {
          // Already running (possibly paused from a previous scan) — just resume + arm
          html5QrCode.resume();
          armScanner();
        }
      });
    }

    // --- Manual entry fallback ---
    const manualToggle = document.getElementById("manual-toggle");
    const manualEntry = document.getElementById("manual-entry");
    const manualId = document.getElementById("manual-id");
    const manualSubmit = document.getElementById("manual-submit");

    manualToggle.addEventListener("click", () => {
      manualEntry.classList.toggle("visible");
    });

    manualSubmit.addEventListener("click", () => {
      const id = manualId.value.trim();
      if (id) {
        submitScan(id);
        manualId.value = "";
      }
    });

    manualId.addEventListener("keydown", (e) => {
      if (e.key === "Enter") manualSubmit.click();
    });
  </script>

</body>
</html>
